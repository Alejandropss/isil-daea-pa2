openapi: 3.0.3
info:
  title: Inventario Service
  version: 1.4.0
  description: API académica responsable del catálogo de productos, precios y stock.
servers:
  - url: http://localhost:8082/inventario-service/api
paths:
  /inventario/productos:
    get:
      summary: Lista el catálogo completo con precio y stock
      responses:
        '200':
          description: Lista obtenida correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductoResponse'
  /inventario/productos/codigo/{codigo}:
    get:
      summary: Obtiene un producto por código de negocio
      parameters:
        - in: path
          name: codigo
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Producto encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductoResponse'
        '404': { description: Producto no encontrado }
  /inventario/productos/codigo/{codigo}/reservas:
    post:
      summary: Reserva stock y devuelve el snapshot comercial del producto
      parameters:
        - in: path
          name: codigo
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservaStockRequest'
      responses:
        '200':
          description: Stock reservado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaStockResponse'
        '400': { description: Datos inválidos }
        '404': { description: Producto no encontrado }
        '409': { description: Stock insuficiente o conflicto de concurrencia }
  /inventario/productos/codigo/{codigo}/devoluciones:
    post:
      summary: Devuelve stock (PA2) - usado al anular un pedido o como compensación
      parameters:
        - in: path
          name: codigo
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevolucionStockRequest'
            example: { cantidad: 2 }
      responses:
        '200':
          description: Stock devuelto correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevolucionStockResponse'
              example:
                productoId: 1
                codigo: LAP-001
                nombre: Laptop
                cantidadDevuelta: 2
                stockRestante: 10
                version: 2
        '400': { description: Cantidad nula, cero o negativa }
        '404': { description: Código de producto inexistente }
        '409': { description: Conflicto de concurrencia (@Version) }
components:
  schemas:
    ProductoResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        codigo: { type: string }
        nombre: { type: string }
        precio: { type: number, format: double }
        stock: { type: integer }
        version: { type: integer, format: int64 }
    ReservaStockRequest:
      type: object
      required: [cantidad]
      properties:
        cantidad:
          type: integer
          minimum: 1
    ReservaStockResponse:
      type: object
      properties:
        productoId: { type: integer, format: int64 }
        codigo: { type: string }
        nombre: { type: string }
        precio: { type: number, format: double }
        cantidadReservada: { type: integer }
        stockRestante: { type: integer }
        version: { type: integer, format: int64 }
    DevolucionStockRequest:
      type: object
      required: [cantidad]
      properties:
        cantidad:
          type: integer
          minimum: 1
    DevolucionStockResponse:
      type: object
      properties:
        productoId: { type: integer, format: int64 }
        codigo: { type: string }
        nombre: { type: string }
        cantidadDevuelta: { type: integer }
        stockRestante: { type: integer }
        version: { type: integer, format: int64 }
